name: Release
on:
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            command: cargo
          - name: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            command: cross
          - name: macos-amd64
            runner: macos-latest
            target: x86_64-apple-darwin
            command: cross
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            command: cross

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cross
        if: matrix.command == 'cross'
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: Build Binary
        run: ${{ matrix.command }} build --verbose --locked --release --target ${{ matrix.target }}

      - name: Prepare archive
        run: |
          strip --target ${{ matrix.target }} target/${{ matrix.target }}/release/mongodb-rust-ping
          export ARCHIVE_NAME=mongodb-rust-ping-${{ matrix.target }}.tar.gz
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          tar -czvf $ARCHIVE_NAME -C target/${{ matrix.target }}/release mongodb-rust-ping

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ARCHIVE_NAME }}
